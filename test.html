<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест</title>
</head>
<body>
  <h1>Тест работает!</h1>
  <button onclick="alert('Кнопка работает!')">Нажми меня</button>
  <p id="online">Онлайн: проверяем...</p>

  <script>
    // Проверяем сервер
    const SERVER_URL = 'https://tapgame-1-icta.onrender.com';
    
    async function checkServer() {
      try {
        const response = await fetch(SERVER_URL + '/api/online');
        const data = await response.json();
        document.getElementById('online').textContent = 'Онлайн: ' + data.online + ' ✅';
      } catch(e) {
        document.getElementById('online').textContent = 'Ошибка: ' + e.message;
      }
    }
    
    checkServer();
  </script>
</body>
</html>
